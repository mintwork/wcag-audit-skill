name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Chromium for runtime tests
        run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Dogfood - SARIF from known-bad fixtures
        if: matrix.node == 22
        run: node dist/cli.js scan test/fixtures/static/bad --sarif -o fixtures.sarif --fail-on none
      - uses: actions/upload-artifact@v7
        if: matrix.node == 22
        with:
          name: fixtures-sarif
          path: fixtures.sarif

  action:
    name: Composite action (uses ./)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Clean fixtures pass
        uses: ./
        with:
          targets: test/fixtures/static/good
          fail-on: minor
          upload-sarif: "false"
      - name: Bad fixtures fail
        id: bad
        continue-on-error: true
        uses: ./
        with:
          targets: test/fixtures/static/bad
          sarif-file: bad.sarif
          upload-sarif: "false"
      - name: Baseline of the bad fixtures
        run: node dist/cli.js scan test/fixtures/static/bad --write-baseline --baseline bad-baseline.json
      - name: Bad fixtures pass with a baseline (no new findings)
        uses: ./
        with:
          targets: test/fixtures/static/bad
          baseline: bad-baseline.json
          sarif-file: baselined.sarif
          upload-sarif: "false"
      - name: Check results
        env:
          EXIT_CODE: ${{ steps.bad.outputs.exit-code }}
          OUTCOME: ${{ steps.bad.outcome }}
        run: |
          test "$EXIT_CODE" = "1" && test "$OUTCOME" = "failure"
          node -e 'const s=JSON.parse(require("fs").readFileSync("bad.sarif","utf8")); if (!s.runs[0].results.length) process.exit(1)'
          node -e 'const s=JSON.parse(require("fs").readFileSync("baselined.sarif","utf8")); if (s.runs[0].results.length) process.exit(1)'
