name: "WCAG Accessibility Audit"
description: "Audit your UI for WCAG 2.2 accessibility failures and report them in GitHub code scanning."
author: "mintwork"
branding:
  icon: "eye"
  color: "blue"
inputs:
  targets:
    description: "Space-separated paths and/or URLs to scan"
    required: false
    default: "."
  fail-on:
    description: "Fail the step at this severity or above: critical, serious, moderate, minor, none"
    required: false
    default: "serious"
  sarif-file:
    description: "Where to write the SARIF report"
    required: false
    default: "wcag-audit.sarif"
  upload-sarif:
    description: "Upload the SARIF file to GitHub code scanning (needs security-events: write; private repositories need GitHub Advanced Security)"
    required: false
    default: "true"
  baseline:
    description: "Path to a baseline file (written with --write-baseline, e.g. .wcag-audit/baseline.json). Findings recorded in it are not reported and do not fail the step; only new findings do."
    required: false
    default: ""
  args:
    description: "Extra CLI arguments, e.g. --ignore storybook --level AA"
    required: false
    default: ""
  version:
    description: "Leave empty to run the CLI from this action's own ref (e.g. @v0). Set an npm version (e.g. 0.1.0 or latest) to run that published package instead."
    required: false
    default: ""
outputs:
  exit-code:
    description: "CLI exit code: 0 clean, 1 findings at or above fail-on, 2 usage or runtime error"
    value: ${{ steps.scan.outputs.exit-code }}
  sarif-file:
    description: "Path of the SARIF report"
    value: ${{ inputs.sarif-file }}
runs:
  using: "composite"
  steps:
    - name: Build wcag-audit-skill from the action ref
      if: ${{ inputs.version == '' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if [ ! -f dist/cli.js ]; then
          npm ci --no-audit --no-fund --loglevel=error
          npm run build --silent
        fi
    - name: Run wcag-audit-skill
      id: scan
      shell: bash
      env:
        WCAG_TARGETS: ${{ inputs.targets }}
        WCAG_FAIL_ON: ${{ inputs.fail-on }}
        WCAG_SARIF: ${{ inputs.sarif-file }}
        WCAG_ARGS: ${{ inputs.args }}
        WCAG_BASELINE: ${{ inputs.baseline }}
        WCAG_VERSION: ${{ inputs.version }}
        WCAG_ACTION_PATH: ${{ github.action_path }}
      run: |
        set +e
        if [ -n "$WCAG_VERSION" ]; then
          cmd=(npx --yes "@mintwork/wcag-audit-skill@$WCAG_VERSION")
        else
          cmd=(node "$WCAG_ACTION_PATH/dist/cli.js")
        fi
        baseline=()
        if [ -n "$WCAG_BASELINE" ]; then baseline=(--baseline "$WCAG_BASELINE"); fi
        # Targets and args are word-split on purpose (space-separated lists).
        # shellcheck disable=SC2086
        "${cmd[@]}" scan $WCAG_TARGETS --sarif -o "$WCAG_SARIF" --fail-on "$WCAG_FAIL_ON" "${baseline[@]}" $WCAG_ARGS
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -ge 2 ]; then echo "::error::wcag-audit-skill exited with $code"; fi
    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && hashFiles(inputs.sarif-file) != '' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: wcag-audit
    - name: Enforce threshold
      shell: bash
      env:
        WCAG_EXIT: ${{ steps.scan.outputs.exit-code }}
      run: exit "${WCAG_EXIT:-2}"
